spring:
  application:
    name: ticketing
  profiles:
    default: dev         
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate     
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: false

  servlet:
    multipart:
      max-file-size: 5MB       
      max-request-size: 6MB
  
  mail:
    host: smtp.gmail.com
    port: 587
    # Đặt trong .env là MY_EMAIL. KHÔNG fallback sang ${USERNAME:}: máy này có sẵn biến môi trường
    # USERNAME=rio của hệ điều hành, và biến môi trường ưu tiên CAO HƠN file .env, nên fallback đó
    # sẽ âm thầm auth SMTP bằng "rio" thay vì email → fail mà log không nói rõ vì sao.
    username: ${MY_EMAIL:}
    password: ${APP_PW:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

app:
  payos:
    client-id: ${PAYOS_CLIENT_ID}
    api-key: ${PAYOS_API_KEY}
    checksum-key: ${PAYOS_CHECKSUM_KEY}
    webhook-url: ${PAYOS_WEBHOOK_URL:}
    payout:
      client-id: ${PAYOS_PAYOUT_CLIENT_ID:}
      api-key: ${PAYOS_PAYOUT_API_KEY:}
      checksum-key: ${PAYOS_PAYOUT_CHECKSUM_KEY:}
      base-url: ${PAYOS_PAYOUT_BASE_URL:}
  jwt:
    secret: ${JWT_SECRET}       
    access-token-ttl: 15m
  auth:
    refresh-token-ttl: 14d    
    reset-token-ttl: 30m        
    reset-password-url: http://localhost:3000/auth/reset-password   
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
  mail:
    enabled: ${MAIL_ENABLED:true}                                    # false = chỉ log nội dung mail, không gọi SMTP (test/dev không cần mạng)
    from: ${MY_EMAIL:}                                               # rỗng = chưa cấu hình: Mailer log.warn rồi bỏ qua, app vẫn chạy
    organizer-refunds-url: http://localhost:3000/organizer/refunds   # link trong mail trỏ về FE (port 3000, giống app.auth.reset-password-url)
    # Link trang đơn cho mail gửi KHÁCH. {orderId} là chỗ RefundNotifier thay bằng id đơn thật.
    # Route lấy từ FE: fe/src/app/router.jsx khai "orders/:id" -> /orders/<uuid>.
    order-url-template: http://localhost:3000/orders/{orderId}
  storage:
    local-dir: uploads            
    public-base-url: ""          
    cloudinary-url: ${CLOUDINARY_URL:} 
    cloudinary-cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    cloudinary-api-key: ${CLOUDINARY_API_KEY:}
    cloudinary-api-secret: ${CLOUDINARY_API_SECRET:}
  seed:
    on-startup: false            
  checkout:
    order-ttl: 15m               
    fee: ${CHECKOUT_FEE:0}         
  payment:
    return-url: http://localhost:3000/checkout/return    
    cancel-url: http://localhost:3000/checkout/cancel
  refund:
    fee-percent: ${REFUND_FEE_PERCENT:0}  
    payout-enabled: ${REFUND_PAYOUT_ENABLED:true}  
    processing-timeout: 30m                
    awaiting-funds-timeout: 24h         
    poll-interval: PT10S               
    queue-interval: PT60S
    recovery-interval: PT60S
    merchant-bin: ${REFUND_MERCHANT_BIN:}
    merchant-account: ${REFUND_MERCHANT_ACCOUNT:}
  cors:
    allowed-origins: http://localhost:3000  

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
