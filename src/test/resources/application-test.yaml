# Profile test (mọi test dùng @ActiveProfiles("test")).
# Cổng thanh toán ở đây là MockPaymentGateway + MockGatewayController trong src/test/java/com/example/demo/support,
# PayOsPaymentGateway tắt vì nó mang @Profile("!test"). Không test nào gọi PayOS thật.
app:
  payment:
    mock-checkout-url: http://localhost:3000/mock-gateway/checkout
    mock-secret: mock-secret          # HMAC-SHA256 ký webhook giả lập, header X-Mock-Signature
  payos:
    # Giá trị giả: application.yaml khai ${PAYOS_CLIENT_ID} không có default, override ở đây để test
    # không cần .env. Bean PayOS không được tạo ở profile test nên các key này không đi đâu cả.
    client-id: test-client-id
    api-key: test-api-key
    checksum-key: test-checksum-key
  bank-simulate:
    # Test không được gọi gateway thật. .env (có BANK_SIMULATE_ADMIN_KEY thật) cũng được nạp khi test, thiếu dòng này
    # thì BTC lưu tài khoản nhận tiền là gọi ra localhost:8090. Test nào cần gateway thì @MockitoBean BankSimAdminClient.
    admin-key: ""
  mail:
    # Tắt SMTP trong test, cùng lý do với PayOS ở trên: test không được gọi ra ngoài.
    # Quan trọng vì IdentityFlowTests.forgotAndResetPassword() gọi /auth/forgot-password 3 lần,
    # và .env (có MY_EMAIL thật) cũng được load khi chạy test -> nếu bật thì mỗi lần test là gửi mail thật.
    # enabled=false: Mailer chỉ log nội dung mail, không mở kết nối nào.
    enabled: false
